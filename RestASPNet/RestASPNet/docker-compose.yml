services:
  rest-asp-net:
    image: jvictorfranca/rest-asp-net:latest
    build:
      context: .
      dockerfile: RestASPNet/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MSSQLServerSqlConnection__ConnectionString=Data Source=host.docker.internal,1433;Initial Catalog=asp_net_10;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    networks:
      - asp-net-network
  
  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - 9000:9000
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - asp-net-network

networks:
    asp-net-network:
      driver: bridge

volumes:
  portainer_data: