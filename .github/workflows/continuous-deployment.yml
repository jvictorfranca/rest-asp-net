name: Continuous Integration, Delivery and Deploy with Github Actions

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Create SQL Server Container
      run: |
        docker run -d --name sqlserver_test \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:latest

        timeout 90s bash -c "until docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C; do sleep 5; done"

    - name: CreateSQL Server Database
      run: docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q "IF DB_ID('asp_net_10') IS NULL CREATE DATABASE [asp_net_10_erudio]" -C

    - name: Checkout Repository Code
      uses: actions/checkout@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore RestASPNet.sln
      working-directory: ./RestAPSNet/RestASPNet

    - name: Build ASP.NET 10 App
      run: dotnet build RestASPNet.sln --configuration Release --no-restore
      working-directory: ./RestAPSNet/RestASPNet

    - name: Test ASP.NET 10 App
      run: dotnet test RestASPNet.sln  --configuration Release --no-build --logger "console;verbosity=detailed"
      working-directory: ./RestAPSNet/RestASPNet

    - name: Docker compose build
      run: docker compose build
      working-directory: ./RestAPSNet/RestASPNet
